# FinCore local infrastructure (Development only) — master spec §4, spec 001 "Integrations".
#
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml down -v   # stop and wipe data
#
# Services: PostgreSQL 17, Keycloak (realms `fincore-staff` and `fincore-customers`, spec 002), Seq.
# Redis, RabbitMQ and MailPit are added by the milestones that first need them.
#
# ALL PASSWORDS IN THIS FILE ARE DEV-ONLY PLACEHOLDERS for a local machine.
# They are never used in Staging/Production (AWS uses RDS-managed secrets + SSM).

name: fincore

services:
  postgres:
    image: postgres:17-alpine
    container_name: fincore-postgres
    environment:
      POSTGRES_DB: fincore
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: fincore_dev_only # DEV-ONLY password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincore -d fincore"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: fincore-keycloak
    # Dev mode (plain HTTP, no production checks); realm files are imported only when the realm is missing.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_only # DEV-ONLY master-realm admin password
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false" # dev only: accept whichever hostname the BFF or browser uses
    ports:
      - "8080:8080" # OIDC + admin console
      - "9000:9000" # management (health, metrics)
    volumes:
      # Two realms mirror the two Cognito pools on AWS (spec 002): staff tokens and customer tokens come from different
      # issuers, so one can never pass as the other. Each realm is imported only when it does not exist yet; after
      # changing a realm file, recreate the Keycloak container (up -d --force-recreate keycloak). Dev users: docs/dev-accounts.md.
      - ./keycloak/fincore-staff-realm.json:/opt/keycloak/data/import/fincore-staff-realm.json:ro
      - ./keycloak/fincore-customers-realm.json:/opt/keycloak/data/import/fincore-customers-realm.json:ro
    healthcheck:
      # The image has no curl/wget; use bash's /dev/tcp against the management port.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  seq:
    image: datalust/seq:2026.1
    container_name: fincore-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true" # dev only: no login for the local Seq UI
    ports:
      - "5341:80" # UI + ingestion (http://localhost:5341)
    volumes:
      - seq-data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/80 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  seq-data:
