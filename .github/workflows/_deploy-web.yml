# Reusable workflow STUB: build one web app for an environment, store the artifact, sync to S3, invalidate CloudFront (master spec §33.8.1).
# Not configured until the AWS deployment spec is implemented — it only reports that.
# TODO(aws-spec): implement.
name: deploy-web

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      app:
        type: string
        required: true
      changed:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - id: info
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_CHANGED: ${{ inputs.changed }}
        run: |
          echo "deploy-web: not configured until the AWS deployment spec is implemented (spec 001)."
          echo "  environment=${INPUT_ENVIRONMENT}"
          echo "  app=${INPUT_APP}"
          echo "  changed=${INPUT_CHANGED}"
