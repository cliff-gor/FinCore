# CI for every pull request and every push to main (master spec §33.1, §33.8.3; spec 001 AC-29).
#
# Path-filtered jobs: backend, web, mobile, infra. The commit-message check always runs on PRs.
# Actions are pinned to major versions for now.
# TODO: pin every action to a full commit SHA once the pipeline works (§33.8.4 note); Dependabot
# (.github/dependabot.yml) then proposes the updates.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NODE_VERSION: "24"
  TERRAFORM_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'openapi/**'
              - 'Directory.*.props'
              - 'global.json'
              - 'FinCore.slnx'
              - '.editorconfig'
              - '.github/workflows/ci.yml'
            web:
              - 'frontend/*'
              - 'frontend/apps/backoffice/**'
              - 'frontend/apps/portal/**'
              - 'frontend/packages/**'
              - 'openapi/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'frontend/*'
              - 'frontend/apps/mobile/**'
              - 'frontend/packages/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'

  backend:
    name: backend (.NET)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FinCore.slnx

      - name: Build (warnings as errors)
        run: dotnet build FinCore.slnx -c Release --no-restore -warnaserror -p:SourceRevisionId=${{ github.sha }}

      # Unit, architecture and integration tests (Testcontainers uses the runner's Docker).
      # Coverage thresholds are enforced inside the test projects by coverlet.msbuild.
      - name: Test
        run: dotnet test --solution FinCore.slnx -c Release --no-build

      - name: Vulnerable package check
        run: |
          dotnet list FinCore.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qiE 'has the following vulnerable packages' vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see log above)."
            exit 1
          fi

      # The API build exports openapi/organization.json without a running server (spec 001).
      - name: OpenAPI snapshot drift check
        run: |
          dotnet build src/Bootstrapper/FinCore.Api -c Release
          git diff --exit-code -- openapi/
          if [ -n "$(git status --porcelain -- openapi/)" ]; then
            echo "::error::Untracked OpenAPI documents were generated; commit them."
            git status --porcelain -- openapi/
            exit 1
          fi

  web:
    name: web (Back Office + Portal)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: API client drift check
        run: pnpm api:check

      - name: Build
        run: pnpm build

      - name: Install Playwright (chromium)
        run: pnpm --filter @fincore/backoffice exec playwright install --with-deps chromium

      - name: End-to-end smoke tests (Playwright)
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/apps/*/playwright-report
          if-no-files-found: ignore

  mobile:
    name: mobile (Expo)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter mobile typecheck

      - name: Unit tests (Jest)
        run: pnpm --filter mobile test

      - name: expo-doctor
        run: pnpm --filter mobile exec expo-doctor

  infra:
    name: infra (Terraform)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: |
          for dir in bootstrap envs/staging envs/production; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the AWS ruleset
        run: |
          tflint --init --config "$(pwd)/.tflint.hcl"
          tflint --recursive --config "$(pwd)/.tflint.hcl"

      # TODO(aws-spec): terraform plan for staging posted as a PR comment (§33.8.3) once AWS is set up.

  commit-messages:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Conventional Commits + no AI attribution (§35.7)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          header_regex='^(feat|fix|test|refactor|docs|chore|ci|infra|style|perf|build|revert)(\([a-z0-9-]+\))?!?: .{1,100}$'
          msg_file="$(mktemp)"
          failed=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            git log -1 --format=%B "${sha}" > "${msg_file}"
            header="$(head -n 1 "${msg_file}")"
            if ! printf '%s\n' "${header}" | grep -qE "${header_regex}"; then
              echo "::error::${sha:0:7}: header is not a Conventional Commit: '${header}'"
              failed=1
            fi
            if ! bash .githooks/commit-msg "${msg_file}"; then
              echo "::error::${sha:0:7}: contains AI attribution"
              failed=1
            fi
          done
          exit "${failed}"
