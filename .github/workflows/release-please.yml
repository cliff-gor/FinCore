# Release automation (master spec §33.7.2; spec 001 AC-29).
# Maintains one Release PR per train (platform, mobile) from Conventional Commits on main.
# Merging a Release PR creates the platform-vX.Y.Z / mobile-vX.Y.Z tag and GitHub Release.
# Config: release-please-config.json + .release-please-manifest.json at the repo root.
# TODO(aws-spec): pin actions to a full commit SHA once the pipeline works (§33.8.4 note).
name: release-please

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write # release-please labels its Release PRs

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      platform_release_created: ${{ steps.release.outputs.release_created }}
      platform_tag_name: ${{ steps.release.outputs.tag_name }}
      platform_version: ${{ steps.release.outputs.version }}
      mobile_release_created: ${{ steps.release.outputs['frontend/apps/mobile--release_created'] }}
      mobile_tag_name: ${{ steps.release.outputs['frontend/apps/mobile--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Optional: a fine-grained PAT (RELEASE_TOKEN) makes Release PRs trigger CI and
          # authors them as the owner instead of github-actions (§33.7.2).
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # TODO(aws-spec): once AWS is set up (spec 001 defers it), add two jobs that need this one: call
  # cd-production.yml with platform_version when platform_release_created is 'true', and call
  # mobile-release.yml when mobile_release_created is 'true'. The outputs above exist for them.
