# Dependency updates (master spec §33.8.5): NuGet, npm (pnpm workspace), GitHub Actions, Terraform — weekly.
version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Conventional Commit prefixes, so Dependabot PRs pass the commit-message check in ci.yml.
    commit-message:
      prefix: chore
      include: scope
    # Packages released together (framework, test stack) arrive as one PR instead of a dozen.
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*", "Aspire.*"]
      test:
        patterns: ["xunit*", "Testcontainers*", "coverlet*", "NetArchTest*", "Verify*", "Shouldly", "NSubstitute"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    # Expo SDK packages and React Native must move in lockstep, so they always arrive in one PR.
    groups:
      expo:
        patterns: ["expo", "expo-*", "@expo/*", "react-native", "react-native-*"]
      tanstack:
        patterns: ["@tanstack/*"]
      lint-and-types:
        patterns: ["eslint*", "@eslint/*", "typescript", "typescript-eslint", "@types/*", "prettier"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: terraform
    directories:
      - "/infra/bootstrap"
      - "/infra/envs/staging"
      - "/infra/envs/production"
    schedule:
      interval: weekly
    commit-message:
      prefix: infra
